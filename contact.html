<!DOCTYPE html>
<html lang="zh-TW">
<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f2ed;color:#1a1a1a;font-size:16px;line-height:1.7}
a{text-decoration:none;color:inherit}
nav{background:#fff;border-bottom:1px solid #e8e0d0;padding:16px 48px;display:flex;align-items:center;justify-content:space-between}
.nav-logo{font-family:Georgia,serif;font-size:17px;font-weight:500;letter-spacing:0.04em}
.nav-back{font-size:13px;color:#888;transition:color 0.2s}
.nav-back:hover{color:#BA7517}
.page-hero{background:#fff9f0;padding:48px 48px 36px;border-bottom:1px solid #e8e0d0}
.page-hero-inner{max-width:720px;margin:0 auto}
.page-tag{font-size:11px;letter-spacing:0.1em;color:#854F0B;background:#FAEEDA;padding:3px 12px;border-radius:20px;display:inline-block;margin-bottom:16px}
.page-hero h1{font-family:Georgia,serif;font-size:30px;font-weight:500;color:#1a1a1a;margin-bottom:8px}
.page-hero p{font-size:14px;color:#888}
.content{max-width:720px;margin:0 auto;padding:48px 48px}
@media(max-width:600px){
  nav{padding:16px 20px}
  .page-hero{padding:36px 20px 28px}
  .content{padding:32px 20px}
}
.contact-card{background:#fff;border-radius:12px;border:1px solid #e8e0d0;padding:32px;margin-bottom:20px}
.contact-card h2{font-family:Georgia,serif;font-size:17px;font-weight:500;color:#1a1a1a;margin-bottom:20px}
.info-row{display:flex;gap:16px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #f0ebe3}
.info-row:last-child{border-bottom:none}
.info-icon{width:36px;height:36px;border-radius:50%;background:#FAEEDA;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;margin-top:2px}
.info-content .label{font-size:12px;color:#999;margin-bottom:2px}
.info-content .val{font-size:15px;color:#1a1a1a;font-weight:500}
.info-content .val a{color:#BA7517}
.map-placeholder{background:#f0ebe3;border-radius:8px;height:200px;display:flex;align-items:center;justify-content:center;margin-top:20px;font-size:13px;color:#999}
</style>
</head>
<body>

<nav>
  <a class="nav-back" href="index.html">← 回創意出版社</a>
  <div class="nav-logo">創意出版社</div>

      <div class="info-content">
        <div class="label">電話</div>

      </div>
    </div>
    <div class="info-row">

      <div class="info-content">
        <div class="label">傳真</div>
        <div class="val">(02) 8712-2808</div>
      </div>
    </div>
    <div class="info-row">
      <div class="info-icon">📍</div>
      <div class="info-content">

        <div class="val">台北市復興北路 178 號 2 樓</div>
      </div>

  <div class="contact-card">
    <h2>交通位置</h2>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3614.5!2d121.5435!3d25.0478!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442a97b3b0fffff%3A0x0!2z5Y-w5matched!5e0!3m2!1szh-TW!2stw!4v1620000000000!5m2!1szh-TW!2stw"

      height="200"
      style="border:0;border-radius:8px;margin-top:4px"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      title="創意出版社地圖">
    </iframe>
    <p style="font-size:13px;color:#888;margin-top:12px">台北市復興北路 178 號 2 樓・捷運南京復興站步行約 5 分鐘</p>
  </div>

  <div class="contact-card" style="text-align:center;padding:28px">
    <p style="font-size:14px;color:#555;margin-bottom:16px">想購書或了解更多？</p>
    <a href="purchase.html" style="display:inline-block;font-size:14px;padding:11px 28px;background:#BA7517;color:#FAEEDA;border-radius:8px">前往購書說明 →</a>
  </div>

</div>

<footer style="background:#fff;padding:24px 48px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e8e0d0">
  <p style="font-size:13px;color:#aaa">© 2026 創意出版社</p>
  <a href="purchase.html" style="font-size:13px;color:#aaa">購書說明</a>
</footer>

</body>
</html>
